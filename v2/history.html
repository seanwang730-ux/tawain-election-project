<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Unified History (V2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../style.css">
<style>
  /* V2-only shell styling. Does not modify style.css or any V1 file — this
     block only styles elements that live inside this new page. */
  #v2-nav {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    background: rgba(5, 5, 10, 0.7);
    backdrop-filter: blur(16px) saturate(1.2);
    -webkit-backdrop-filter: blur(16px) saturate(1.2);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    position: relative;
    z-index: 20;
  }
  #v2-home {
    color: rgba(255,255,255,0.6); text-decoration: none; font-size: 12px; font-weight: 600; white-space: nowrap;
    padding: 4px 10px; border: 1px solid rgba(255,255,255,0.12); border-radius: 7px;
  }
  #v2-home:hover { color: #fff; border-color: rgba(255,255,255,0.3); }
  #v2-title {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.9);
    white-space: nowrap;
  }
  #v2-title .v2-badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 999px;
    background: rgba(168, 85, 247, 0.18);
    border: 1px solid rgba(168, 85, 247, 0.45);
    color: #d8b4fe;
    vertical-align: middle;
  }
  .v2-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 3px 6px;
    border-radius: 6px;
    background: rgba(255,255,255,0.02);
  }
  .v2-group-label {
    font-size: 9.5px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.05em;
    margin-right: 4px;
    white-space: nowrap;
  }
  .v2-crumb-sep { color: rgba(255,255,255,0.25); font-size: 11px; }
  .btn:disabled, .btn[disabled] {
    opacity: 0.32 !important;
    cursor: not-allowed !important;
    box-shadow: none !important;
  }
  #v2-status {
    margin-left: auto;
    font-size: 10.5px;
    color: rgba(255,255,255,0.45);
    white-space: nowrap;
    max-width: 38vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #v2-status.warn { color: #fbbf24; }
  /* one row (user 2026-10-31: 「Mayors 2022 這個 hist mode 的小 title 刪掉…年數變成折疊…地方選舉分成民意代表跟行政首長…按鈕只能
     維持一行」): the status line shows only warnings, group labels and the V1 compare link go, years are a select (as in
     V1), local types sit behind 行政首長 / 民意代表; the bar's right side (crumb, ⚠, 色盲友善, zh/EN) is pushed right */
  #v2-nav { flex-wrap: nowrap; gap: 10px; }
  #v2-status:not(.warn) { display: none; }
  .v2-group-label, #v2-compare-link, #v2-year-group .btn { display: none !important; }
  /* ⚠ first, then crumb + 全台鄉鎮市區 / 全台村里, flush against 中文 / EN on the right (user 2026-10-31: 「全台，全台鄉鎮市區，
     全台村里都往右移…跟中英切換對齊，可能把紅色警告放在最左邊」): one auto margin, on the ⚠ */
  #v2-nav > .v2-disc { margin-left: auto; }
  #v2-nav > .v2-nav, #v2-nav > #v2-lang, #v2-nav > #v2-status { margin-left: 0; }
  #v2-nav > .v2-nav, #v2-nav > .v2-tools { margin-right: 0 !important; }
  #v2-year-select { font: inherit; font-size: 12px; font-weight: 600; color: #e7eaf0; background: rgba(18,24,38,.9); border: 1px solid rgba(255,255,255,.18); border-radius: 7px; padding: 4px 6px; cursor: pointer; }
  #v2-cat-group .btn { white-space: nowrap; }
  #v2-frame-wrap { flex: 1; position: relative; }
  /* Both engines are persistent, permanently-mounted iframes stacked exactly
     on top of each other; only the active one is visible. visibility:hidden
     (not display:none) is required here — display:none zeroes clientWidth/
     clientHeight, which corrupts the hidden engine's D3 projection fitting
     the moment it's shown again (confirmed via prototype: negative/degenerate
     scale). visibility:hidden preserves a real layout box, so this never
     happens, and it also natively drops pointer-event hit-testing on the
     hidden iframe (pointer-events:none kept anyway, defensively). */
  .v2-engine-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #0b0d12;
    visibility: hidden;
    pointer-events: none;
  }
  .v2-engine-frame.v2-engine-active {
    visibility: visible;
    pointer-events: auto;
  }
  #v2-boot-veil {
    position: absolute; inset: 0;
    background: #0b0d12;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    letter-spacing: 0.05em;
    z-index: 5;
    transition: opacity 0.25s ease;
  }
  #v2-boot-veil.hidden { opacity: 0; pointer-events: none; }
  a.v2-link {
    font-size: 10.5px;
    color: rgba(40,200,200,0.85);
    text-decoration: none;
    white-space: nowrap;
  }
  a.v2-link:hover { text-decoration: underline; }
  /* zh / EN switch — same look as the other V2 pages (v2-shell.css .v2-lang) */
  #v2-lang { margin-left: auto; display: inline-flex; border: 1px solid rgba(255,255,255,.09); border-radius: 8px; overflow: hidden; }
  #v2-lang button { font: inherit; font-size: 11.5px; font-weight: 600; color: #e7eaf0; background: transparent; border: 0; padding: 5px 10px; cursor: pointer; }
  #v2-lang button[aria-pressed="true"] { background: rgba(40,200,200,.22); }
  #v2-lang button:focus-visible { outline: 2px solid #28c8c8; outline-offset: 2px; }
</style>
</head>

<script>
(function () {
  // Unified History V2 — pure navigation/orchestration shell.
  // Renders NOTHING of its own. Local scope embeds council.html and drives it
  // via setMayorMode / setCouncilElectionMode / setCouncilMode. National scope
  // embeds test.html (council.html's own top-nav links there for Geographic
  // District Legislator — its legislative engine is deliberately disabled
  // in council.html itself, see 2026-08-16 comment on winner-year-select in
  // council.html's source) and drives it via setMode / setWinnerYear /
  // setIndLegMode. No V1 file is read, copied, or altered by this script.
  //
  // Persistent dual-engine architecture (2026-09-26): both V1 engines get
  // their own permanent <iframe> and are never re-navigated after their first
  // load. Local (council.html) loads immediately since it is V2's initial
  // scope; National (test.html) is only requested AFTER Local's first view is
  // fully usable, preloaded silently in the background, then kept resident
  // forever. Scope switching after that is a CSS visibility toggle between
  // the two already-loaded iframes — no reload, no state loss. Replaces the
  // old single-iframe src-swap model (15-25s reload per Local<->National
  // switch) — see CHANGELOG_v2.md's feasibility audit for the measurements
  // and the display:none pitfall (corrupts D3 projection scale) that ruled
  // out that hiding strategy in favor of visibility:hidden.
  var ENGINE_SRC = { local: '../council.html', national: '../test.html' };

  // ---- language (user 2026-10-29: 「歷屆頁要有中英文切換然後中英文切換應該要放在上方的常駐列跟index or v2一樣」) ----
  // One zh / EN switch in the bar, the other V2 pages' look and storage (localStorage v2_lang). The bar labels carry
  // data-zh / data-en (and data-zh-title / data-en-title); both engines get setLang(); V2's overlays read the engine's T().
  var lang = 'zh';
  try { var savedLang = localStorage.getItem('v2_lang'); if (savedLang === 'en' || savedLang === 'zh') lang = savedLang; } catch (e) {}
  function T(zh, en) { return lang === 'en' ? en : zh; }
  function applyLang() {
    document.documentElement.lang = lang === 'en' ? 'en' : 'zh-Hant';
    Array.prototype.forEach.call(document.querySelectorAll('[data-zh]'), function (el) { el.textContent = el.getAttribute('data-' + lang); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-zh-title]'), function (el) { el.title = el.getAttribute('data-' + lang + '-title'); });
    Array.prototype.forEach.call(document.querySelectorAll('#v2-lang button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === lang)); });
  }
  var statusEl = document.getElementById('v2-status');
  var veil = document.getElementById('v2-boot-veil');
  var titleEl = document.getElementById('v2-title');
  var compareLink = document.getElementById('v2-compare-link');
  var scopeBtns = Array.prototype.slice.call(document.querySelectorAll('#v2-scope-group [data-scope]'));
  var typeBtns = Array.prototype.slice.call(document.querySelectorAll('#v2-type-group [data-type]'));
  var typeBtnsAll = Array.prototype.slice.call(document.querySelectorAll('#v2-type-group .btn'));
  var yearBtns = Array.prototype.slice.call(document.querySelectorAll('#v2-year-group [data-year]'));
  var yearSel = document.getElementById('v2-year-select');
  var catGroup = document.getElementById('v2-cat-group');
  var catBtns = Array.prototype.slice.call(document.querySelectorAll('#v2-cat-group [data-cat]'));
  var TYPE_CAT = { mayor: 'exec', township: 'exec', villchief: 'exec', councilor: 'rep', townrep: 'rep' };
  var CAT_FIRST = { exec: 'mayor', rep: 'councilor' };
  var submodeGroup = document.getElementById('v2-submode-group');
  var submodeSep = document.getElementById('v2-submode-sep');
  // Selects by data-submode-scope, not data-submode, so it also picks up the
  // disabled Party-List placeholder chip (which has no data-submode value
  // since it isn't selectable yet).
  var submodeBtns = Array.prototype.slice.call(document.querySelectorAll('#v2-submode-group [data-submode-scope]'));

  var state = {
    scope: 'local',
    type: 'mayor',
    localYear: '2022',
    councilSubmode: 'party',
    legYear: '2024',
    legSubmode: 'geo'
  };

  // History is data-adaptive: each Legislative sub-mode has its own real V1
  // year range, not a single shared range forced across all of them.
  // Geographic District: winner-year-select's actual options (2016 is V1's
  // own documented placeholder year — some regions render grey, kept as-is).
  // Lowland/Highland Indigenous: IND_LEG_P/IND_LEG_M are flat, un-keyed-by-
  // year objects in V1 — confirmed there is no 2016/2020 variant, only a
  // 2024 roster (matching HIST_IND_SEATS_2016/2020 being seat-count-only).
  // Party-List: setPLCountyMode's own plcounty-year-select options, minus
  // 'sim' (推演) — that is scenario simulation, not a historical result, and
  // belongs to a future Forecast/Simulation area, not History.
  var LEG_YEARS_BY_SUBMODE = {
    geo: ['2008', '2012', '2016', '2020', '2024'],   // 2008 / 2012: V2 on the 2016 district map (history-legdist.js)
    'ind-p': ['2008', '2012', '2016', '2020', '2024'],   // V2 draws these from CEC files (history-legind.js); the engine only has 2024 (2008 / 2012 added 2026-10-31)
    'ind-m': ['2008', '2012', '2016', '2020', '2024'],
    pl: ['2008', '2012', '2016', '2020', '2024'],
    // (縣市席次點 seat dots removed 2026-10-27, user: 「把席次原點功能刪掉」; history-seatdots.js kept in backup/)
  };

  // 總統 (2026-10-31, user: 「好做總統」): V2 draws it from CEC files (history-legind.js kind 'pres', v2/data_pres.js)
  var PRES_YEARS = ['2008', '2012', '2016', '2020', '2024'];

  function setStatus(text, warn) {
    statusEl.textContent = text;
    statusEl.classList.toggle('warn', !!warn);
  }

  function renderControls() {
    scopeBtns.forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-scope') === state.scope);
    });

    // 行政首長 / 民意代表 (local only): only the chosen group's types show
    var cat = TYPE_CAT[state.type] || 'exec';
    catBtns.forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-cat') === cat); });
    catGroup.style.display = state.scope === 'local' ? '' : 'none';
    typeBtnsAll.forEach(function (b) {
      var show = b.getAttribute('data-type-scope') === state.scope && (state.scope !== 'local' || TYPE_CAT[b.getAttribute('data-type')] === cat);
      b.style.display = show ? '' : 'none';
      if (b.hasAttribute('data-type')) {
        b.classList.toggle('active', b.getAttribute('data-type') === state.type);
      }
    });

    yearBtns.forEach(function (b) {
      var yr = b.getAttribute('data-year');
      var scopeMatch = b.getAttribute('data-year-scope') === state.scope;
      var show = scopeMatch;
      if (scopeMatch && state.scope === 'national') {
        // Data-adaptive: only show years the *current* Legislative sub-mode
        // actually has data for (e.g. Party-List's wider 2008–2024 range vs.
        // Geographic/Indigenous's narrower one) rather than one shared range.
        var allowed = state.type === 'president' ? PRES_YEARS : (LEG_YEARS_BY_SUBMODE[state.legSubmode] || []);
        show = allowed.indexOf(yr) !== -1;
      }
      b.style.display = show ? '' : 'none';
      var activeYr = state.scope === 'national' ? state.legYear : state.localYear;
      b.classList.toggle('active', yr === activeYr);
    });
    // the year select mirrors the (hidden) year buttons: same options, same active one
    var opts = yearBtns.filter(function (b) { return b.style.display !== 'none'; });
    yearSel.innerHTML = opts.map(function (b) {
      var y = b.getAttribute('data-year');
      return '<option value="' + y + '"' + (b.classList.contains('active') ? ' selected' : '') + '>' + y + '</option>';
    }).join('');

    // 立委 sub-modes are the seat cards on the map's left now (see stripBase5); the bar keeps 縣市議員's pair only
    var showSubmode = state.scope === 'local' && state.type === 'councilor';
    try {
      var nd = document.getElementById('v2-frame-national').contentDocument, cards = nd && nd.querySelectorAll('#v2-leg-left .stats-card');

        if (window.V2TcBorder) { window.V2TcBorder.attach(win); window.V2TcBorder.unifyBadges(win); window.V2TcBorder.fixEd2016(win); }
        if (window.V2Career) window.V2Career.attach(win);   // 跳槽 tags in candidate rows (v2/career.js)   // + 區域立委-style result tags (council.html)
        // legislative bars as long as the mayor / council ones (legbars.js; the national test.html engine only)
        if (key === 'national' && window.V2LegBars) window.V2LegBars.attach(win);
        // population glow hidden in every History election, both engines (noglow.js; hidden only, V1 untouched)
        if (window.V2NoGlow) window.V2NoGlow.attach(win);
        eng.ready = true;
        eng.loading = false;
        eng.loadMs = performance.now() - startedAt;
        if (onReady) onReady(win);
      });
    });
    eng.frame.src = ENGINE_SRC[key];
  }

  function desiredSnapshotFor(key) {
    if (key === 'local') {
      if (state.type === 'township') return { type: 'township', year: state.localYear };
      if (state.type === 'villchief') return { type: 'villchief', year: state.localYear };
      if (state.type === 'townrep') return { type: 'townrep', year: state.localYear };
      return state.type === 'mayor'
        ? { type: 'mayor', year: state.localYear }
        : { type: 'councilor', year: state.localYear, submode: state.councilSubmode };
    }
    if (state.type === 'president') return { type: 'president', year: state.legYear };
    if (state.legSubmode === 'pl') return { submode: 'pl', year: state.legYear };
    if (state.legSubmode === 'ind-p' || state.legSubmode === 'ind-m') return { submode: state.legSubmode, year: state.legYear };
    return { submode: 'geo', year: state.legYear };
  }

  // Applies V2's *current* desired state to one engine via the same V1 entry
  // points its own toolbar would call — but the minimum call needed:
  //  - if the engine's last-applied snapshot already matches (e.g. switching
  //    back to an engine nothing changed since last time), skip the V1 call
  //    entirely instead of re-running an unnecessary 5-9s redraw (state stays
  //    authoritative in V2, but an already-correct engine is never reset
  //    merely because it becomes visible again);
  //  - if only the Councilor sub-mode changed (year/type unchanged), use the
  //    lighter setCouncilMode()-only path (replaces the old, call-site-based
  //    applyCouncilSubModeOnly() with the same effect, now data-driven);
  //  - otherwise run the full sequence, exactly as V1's own toolbar would:
  //    Local/Mayor -> setMayorMode(yr); Local/Councilor -> setCouncilElectionMode(yr)+setCouncilMode(submode);
  //    National Geographic/Indigenous -> setMode('winner')+setWinnerYear(yr)[+setIndLegMode];
  //    National Party-List -> setMode('winner')+setPLCountyMode(yr) (setPLCountyMode is
  //    defined identically in test.html/party_list.html and ignores winnerYear entirely).
  function applyToEngine(key, opts) {
    var eng = engines[key];
    renderControls();
    if (!eng.ready) return;
    var desired = desiredSnapshotFor(key);
    var force = !!(opts && opts.force);
    var prev = eng.lastApplied;
    if (!force && prev && JSON.stringify(prev) === JSON.stringify(desired)) {
      setStatus(T('（' + (key === 'national' ? '全國' : '地方') + '引擎已是此狀態，未重新呼叫 V1）', '(' + (key === 'national' ? 'National' : 'Local') + ' engine already in this state)'));
      return;
    }
    var win = eng.frame.contentWindow;
    // 跳槽 tags: which race the panel shows (v2/career.js) — 不分區 has party rows only
    var RACE = { mayor: 'M', councilor: 'C', township: 'T', townrep: 'R', villchief: 'V' };
    win.__v2CareerCtx = key === 'local' ? (RACE[desired.type] ? { race: RACE[desired.type], year: desired.year } : null)
      : (desired.submode === 'pl' || desired.type === 'president' ? null : { race: 'L', year: desired.year });
    try {
      if (key === 'local') {
        if (window.V2TownshipHead) window.V2TownshipHead.clear(win);
        if (window.V2VillageChief) window.V2VillageChief.clear(win);
        if (window.V2TownshipRep) window.V2TownshipRep.clear(win);
        if (desired.type === 'townrep') {
          // 鄉鎮市民代表：V1 setMayorMode(yr) sets up the mode, then V2 redraws the map as 代表會 blocks (the engine's
          // 縣市議員 政黨比例 colouring, no population glow), the hemicycle in the engine's county-council box, click
          // a township → its villages (history-townrep.js)
          win.setMayorMode(desired.year);
          var nTr = window.V2TownshipRep.draw(win, desired.year);
          setStatus(T('鄉鎮市民代表 ' + desired.year + '：' + nTr + ' 席', 'Township representatives ' + desired.year + ': ' + nTr + ' seats'));
        } else if (desired.type === 'villchief') {
          // 村里長：V1 setMayorMode(yr) sets up the mode (legend, chips, panel), then V2 redraws the map as the
          // engine's 全台村里 view with the village-chief results, no population glow; the lowest level, no
          // drill-down; panels are built from the engine's own pieces (history-villchief.js)
          win.setMayorMode(desired.year);
          var nVc = window.V2VillageChief.draw(win, desired.year);
          setStatus(T('村里長 ' + desired.year + '：' + nVc + ' 個村里', 'Village chiefs ' + desired.year + ': ' + nVc + ' villages'));
        } else if (desired.type === 'township') {
          // 鄉鎮市區長：V1 setMayorMode(yr) sets up the mode (legend, chips, panel), then V2 redraws the map as
          // the engine's 全台鄉鎮市區 view with the township-head results, no population glow; click a
          // township → its village layer; panels are built from the engine's own pieces (history-townhead.js)
          win.setMayorMode(desired.year);
          var nTh = window.V2TownshipHead.draw(win, desired.year);
          setStatus(T('鄉鎮市區長 ' + desired.year + '：' + nTh + ' 個有選舉的鄉鎮市區', 'Township heads ' + desired.year + ': ' + nTh + ' elected townships'));
        } else if (desired.type === 'councilor' && prev && prev.type === 'councilor' && prev.year === desired.year) {
          win.setCouncilMode(desired.submode);
          setStatus(T('縣市議員 ' + desired.year, 'Councilors ' + desired.year));
        } else if (desired.type === 'mayor') {
          win.setMayorMode(desired.year);
          setStatus(T('縣市長 ' + desired.year, 'Mayors ' + desired.year));
        } else {
          win.setCouncilElectionMode(desired.year);
          win.setCouncilMode(desired.submode);
          setStatus(T('縣市議員 ' + desired.year, 'Councilors ' + desired.year));
        }
      } else {
        if (window.V2LegInd) window.V2LegInd.clear(win);
        var wasLegDist = window.V2LegDist ? window.V2LegDist.clear(win) : false;
        var oldYear = desired.year === '2008' || desired.year === '2012';
        var legDist = desired.submode === 'geo' && oldYear;
        // 政黨輪替分析 fold: 區域立委 only (user 2026-10-28: 「把政黨輪替分析折疊隱藏」「不分區裡的…也要」「只保留區域立委」).
        // The engine shows / hides #flip-analysis-box itself, so a class on its root wins over its inline display.
        // 不分區: its 跑馬燈 (#ticker) hidden too (user: 「把跑馬燈（不分區的）隱藏」); 原住民: 圓餅 / 激戰區域 buttons hidden
        // (user: 「「山地平地原住民立委」隱藏圓餅跟激戰區域按鈕」)
        if (window.V2PLNat) window.V2PLNat.clear(win);
        if (!win.document.getElementById('v2-flipfold-style')) {
          var fs = win.document.createElement('style');
          fs.id = 'v2-flipfold-style';
          fs.textContent = 'html.v2-noflip #flip-analysis-box { display: none !important; }\n' +
            'html.v2-pl #ticker { display: none !important; }\n' +
            'html.v2-ind #pie-swing-row { display: none !important; }\n' +
            // its map-legend holds only the 激戰區域 key there, for the overlay the hidden button switched
            'html.v2-ind #map-legend { display: none !important; }\n' +
            // 總統: no seats — the left seat cards are 立委's
            'html.v2-pres #v2-leg-left { display: none !important; }\n' +
            // 區域立委 2008 / 2012 (history-legdist.js): the engine underneath is on 2016 — its 2016-only boxes are hidden
            // (圓餅 / 激戰區域 and, for 2012, 政黨輪替分析 run on 2008 / 2012 data — history-legdist.js; 2008 has no earlier
            // year, so its 政黨輪替分析 box is hidden — user 2026-10-28: 「政黨輪替分析加在2012(2008隱藏）」)
            'html.v2-legdist-noflip #flip-analysis-box { display: none !important; }';
          win.document.head.appendChild(fs);
        }
        var rootCls = win.document.documentElement.classList;
        rootCls.toggle('v2-noflip', desired.submode !== 'geo');
        rootCls.toggle('v2-legdist', legDist);
        rootCls.toggle('v2-pl', desired.submode === 'pl');
        var pres = desired.type === 'president';
        rootCls.toggle('v2-ind', pres || desired.submode === 'ind-p' || desired.submode === 'ind-m');
        rootCls.toggle('v2-pres', pres);
        win.setMode('winner');
        if (pres) {
          // 總統: one nationwide race like 原住民立委 — the engine is put in its indigenous mode (a blank V2 can draw on;
          // 2008 / 2012 on 2016) and V2 draws 全台 → 22 縣市 → 鄉鎮 → 村里 from CEC files; no seat cards (html.v2-pres)
          win.setWinnerYear(oldYear ? '2016' : desired.year);
          win.setIndLegMode('p');
          window.V2LegInd.draw(win, desired.year, 'pres');
          setStatus(T('總統 ' + desired.year, 'President ' + desired.year));
        } else if (desired.submode === 'pl') {
          // the seat cards follow the engine's year (2008 / 2012: 2016 underneath, cards from V2LegDist.cards below)
          win.setWinnerYear(oldYear ? '2016' : desired.year);
          win.setPLCountyMode(desired.year);
          // 不分區 is one nationwide district: V2 starts at a 全台 block + 34-seat hemicycle, click → the engine's 22 縣市
          window.V2PLNat.draw(win, desired.year);
          if (oldYear) window.V2LegDist.cards(win, desired.year);
          setStatus(T('不分區 ' + desired.year, 'Party list ' + desired.year));
        } else {
          win.setWinnerYear(oldYear ? '2016' : desired.year);
          if (legDist) {
            // 2008 / 2012 were fought on the 2016 districts: the engine draws its 2016 map state, V2 the year's results
            window.V2LegDist.draw(win, desired.year);
            setStatus(T('區域立委 ' + desired.year + '（2016 選區圖＋' + desired.year + ' 中選會資料）', 'District legislators ' + desired.year + ' (2016 district map + ' + desired.year + ' CEC data)'));
          } else if (desired.submode === 'ind-p' || desired.submode === 'ind-m') {
            var t = desired.submode === 'ind-p' ? 'p' : 'm';
            win.setIndLegMode(t);
            // 原住民立委 is one nationwide district: V2 redraws it as 全台 → 22 縣市 → 鄉鎮 → 村里 from CEC files
            // (history-legind.js; all three years — the engine's own IND_LEG_* is 2024 only)
            window.V2LegInd.draw(win, desired.year, t);
            if (oldYear) window.V2LegDist.cards(win, desired.year);
            setStatus(T('原住民立委 ' + desired.year, 'Indigenous legislators ' + desired.year));
          } else {
            if (wasLegDist) win.goED();   // 2008 / 2012 → 2016: the engine was already on 2016 and would not redraw
            // 2016 / 2020 / 2024: the same 全台 seat panel as 2008 / 2012 on the engine's 全台 view (history-legdist.js)
            if (desired.submode === 'geo') window.V2LegDist.setNationalYear(win, desired.year);
            setStatus(T('區域立委 ' + desired.year, 'District legislators ' + desired.year));
          }
        }
      }
      eng.lastApplied = desired;
    } catch (e) {
      setStatus(T('⚠ 呼叫失敗：', '⚠ Call failed: ') + e.message, true);
    }
  }

  function applyCurrent(opts) {
    applyToEngine(engineKeyForScope(state.scope), opts);
  }

  function activateEngine(key) {
    pendingScope = null;
    showEngine(key);
    veil.classList.add('hidden');
    applyToEngine(key);
    if (tools) tools.refresh();
    if (navBar) navBar.refresh();
    if (disc) disc.refresh();
  }
  // the engine's 「i」 and 色盲友善 buttons in the bar (v2/toolbtns.js; user 2026-10-29: 「放到上方的常駐欄位」) — they act on
  // the engine on screen; 色盲友善 exists only in the Local engine (council.html)
  var tools = window.V2Tools ? window.V2Tools.mount(document.getElementById('v2-nav'), document.getElementById('v2-lang'), function () {
    var k = engineKeyForScope(state.scope), e = engines[k];
    return e && e.ready ? document.getElementById('v2-frame-' + k).contentWindow : null;
  }, function () { return lang; }) : null;
  // crumb + 全台鄉鎮市區 / 全台村里, then ⚠, in the bar left of the 「i」 — the 2026 forecast page's layout (v2/navbar.js,
  // v2/disclaimer.js; user 2026-10-31: 「在2026做的版面更新都套用在其他模式中」); both follow the engine on screen
  var activeWin = function () {
    var k = engineKeyForScope(state.scope), e = engines[k];
    return e && e.ready ? document.getElementById('v2-frame-' + k).contentWindow : null;
  };
  var navBox = document.getElementById('v2-nav'), navBefore = function () { return navBox.querySelector('.v2-tools') || document.getElementById('v2-lang'); };
  var navBar = window.V2NavBar ? window.V2NavBar.mount(navBox, navBefore(), activeWin) : null;
  var disc = window.V2Disclaimer ? window.V2Disclaimer.mount(navBox, navBox.querySelector('.v2-nav') || navBefore(), activeWin) : null;

  // Which Election Type values are meaningful for each Scope. This is the
  // actual root cause fix for the old "year switch does nothing" bug: the
  // apply dispatch used to be `if (scope==='local') {...} else if
  // (type==='legislative') {...}` — if state.type was left over from the
  // other scope, NEITHER branch matched and the apply silently no-opped. It
  // was never a timing race; forcing state.type to a valid value for the new
  // scope removes the invalid state entirely rather than papering over it.
  var VALID_TYPES = { local: ['mayor', 'councilor', 'township', 'townrep', 'villchief'], national: ['legislative', 'president'] };
  function setScope(s) {
    if (s === state.scope) { applyCurrent(); return; }
    state.scope = s;
    if (VALID_TYPES[s].indexOf(state.type) === -1) state.type = VALID_TYPES[s][0];
    renderControls();
    var key = engineKeyForScope(s);
    var eng = engines[key];
    if (eng.ready) {
      activateEngine(key);
    } else {
      // Secondary engine's background preload hasn't finished yet (or, in the
      // rare edge case of a switch fired before the preload trigger even ran,
      // hasn't started at all) — show the loading state, never start a
      // duplicate load, and activate the instant it becomes ready.
      pendingScope = key;
      veil.classList.remove('hidden');
      setStatus(T((key === 'national' ? '全國' : '地方') + '引擎仍在背景載入中，完成後會自動顯示…', (key === 'national' ? 'National' : 'Local') + ' engine still loading in the background; it will appear when ready…'));
      if (!eng.loading) bootEngine(key, function () { if (pendingScope === key) activateEngine(key); });
    }
  }

  // ---- boot sequence --------------------------------------------------------
  // 1. Load ONLY the primary engine (Local, V2's initial scope).
  // 2. Wait for it to be ready and its first view fully applied/rendered.
  // 3. Only then start preloading National in the background. It stays
  //    silent (no status/veil change) unless the user switches to it before
  //    it finishes, per setScope()'s pendingScope path.
  //    Deliberately NOT gated on requestAnimationFrame: rAF is throttled/
  //    paused entirely by the browser on a tab that lacks document focus
  //    (confirmed via testing — a user who opens History in a background
  //    tab would get no preload at all until they focus it, silently
  //    defeating the whole point). setTimeout(fn, 0) alone still yields one
  //    tick back to the browser first, but fires regardless of tab focus.
  showEngine('local');
  applyLang();
  Array.prototype.forEach.call(document.querySelectorAll('#v2-lang button'), function (b) {
    b.addEventListener('click', function () {
      var l = b.getAttribute('data-lang');
      if (l === lang) return;
      lang = l;
      try { localStorage.setItem('v2_lang', lang); } catch (e) {}
      applyLang();
      renderControls();
      // both engines switch (each redraws its own panels / map titles); V2 overlays render through the engine's T()
      ['local', 'national'].forEach(function (k) {
        var w = engines[k] && engines[k].ready && document.getElementById('v2-frame-' + k).contentWindow;
        if (w && typeof w.setLang === 'function') { try { w.setLang(lang); } catch (e) {} }
        if (w) fixTitle(w.document);
      });
      setStatus('');   // the last status was written in the old language
      if (tools) tools.refresh();
      if (disc) disc.refresh();
    });
  });
  setStatus(T('正在載入地方引擎…', 'Loading the Local engine…'));
  bootEngine('local', function () {
    veil.classList.add('hidden');
    applyToEngine('local', { force: true });
    if (tools) tools.refresh();
    if (navBar) navBar.refresh();
    if (disc) disc.refresh();
    setTimeout(function () {
      bootEngine('national', function () {
        if (pendingScope === 'national') activateEngine('national');
      });
    }, 0);
  });

  scopeBtns.forEach(function (b) {
    b.addEventListener('click', function () { setScope(b.getAttribute('data-scope')); });
  });

  typeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-type');
      if (t === state.type) return;
      state.type = t;
      applyCurrent();
    });
  });

  // 行政首長 / 民意代表: back to the type last used in that group (first one the first time)
  var lastByCat = { exec: 'mayor', rep: 'councilor' };
  catBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var c = b.getAttribute('data-cat');
      if (TYPE_CAT[state.type] === c) return;
      if (TYPE_CAT[state.type]) lastByCat[TYPE_CAT[state.type]] = state.type;
      state.type = lastByCat[c] || CAT_FIRST[c];
      applyCurrent();
    });
  });
  // the year select runs the (hidden) year button's own handler
  yearSel.addEventListener('change', function () {
    var b = yearBtns.filter(function (x) { return x.getAttribute('data-year') === yearSel.value && x.style.display !== 'none'; })[0];
    if (b) b.click();
  });

  yearBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      // A year button is only ever visible when LEG_YEARS_BY_SUBMODE already
      // confirms the current sub-mode supports it (see renderControls), so
      // no further validation is needed here — clicking it is always safe.
      var yr = b.getAttribute('data-year');
      if (state.scope === 'national') {
        if (yr === state.legYear) return;
        state.legYear = yr;
      } else {
        if (yr === state.localYear) return;
        state.localYear = yr;
      }
      applyCurrent();
    });
  });

  submodeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      if (b.disabled) return;
      var grp = b.getAttribute('data-submode-scope');
      var m = b.getAttribute('data-submode');
      if (grp === 'councilor') {
        if (m === state.councilSubmode) return;
        state.councilSubmode = m;
        applyCurrent();
      } else {
        if (m === state.legSubmode) return;
        state.legSubmode = m;
        // Data-adaptive year preservation: keep the current year if the
        // destination sub-mode actually supports it (e.g. Geographic 2020 ->
        // Party-List stays 2020); otherwise snap to that sub-mode's most
        // recent supported year (e.g. Party-List 2012 -> Geographic can't
        // stay 2012, so it becomes 2024) rather than entering an invalid
        // combination.
        var allowed = LEG_YEARS_BY_SUBMODE[m] || [];
        if (allowed.indexOf(state.legYear) === -1) {
          state.legYear = allowed[allowed.length - 1];
        }
        applyCurrent();
      }
    });
  });

  renderControls();
})();
</script>

</body>
</html>

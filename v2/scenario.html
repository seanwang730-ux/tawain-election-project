<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>情境推演 · V2</title>
<link rel="stylesheet" href="v2-shell.css?v=20261022b">
</head>
<body>
<div id="v2-bar">
  <a class="v2-home" href="index.html" data-zh="← 首頁" data-en="← Home">← 首頁</a>
  <span class="v2-title"><span data-zh="情境推演" data-en="Scenarios">情境推演</span><span class="v2-badge">V2</span></span>
  <div class="v2-controls">
    <div class="v2-seg" role="group" aria-label="推演 Scenario">
      <button type="button" data-kind="district" aria-pressed="true" data-zh="區域立委" data-en="District seats">區域立委</button>
      <button type="button" data-kind="pl" aria-pressed="false" data-zh="不分區" data-en="Party list">不分區</button>
    </div>
    <button type="button" class="v2-btn" id="btn-2p" aria-pressed="false" data-zh="兩黨對決" data-en="Two-party race">兩黨對決</button>
    <button type="button" class="v2-btn" id="btn-by" aria-pressed="false" data-zh="補選" data-en="By-election">補選</button>
    <button type="button" class="v2-btn" id="btn-params" data-zh="⚙ 推演參數" data-en="⚙ Parameters">⚙ 推演參數</button>
  </div>
  <span id="v2-status"></span>
  <span class="v2-spacer"></span>
  <div class="v2-lang" role="group" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true">中文</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
</div>
<div id="v2-stage">
  <iframe id="v2-engine" title="情境推演（V1 test.html 引擎）"></iframe>
  <div id="v2-veil" data-zh="載入立委選舉資料…" data-en="Loading legislative data…">載入立委選舉資料…</div>
</div>
<script src="legbars.js?v=20261027f"></script>
<script src="tcborder.js?v=20261029a"></script>
<script src="i18n.js?v=20261029c"></script>
<script src="toolbtns.js?v=20261031a"></script>
<script src="navbar.js?v=20261030a"></script>
<script src="disclaimer.js?v=20261031c"></script>
<script src="v2-shell.js?v=20261031a"></script>
<script>
  // Scenario simulation only (prediction quadrant):
  //  district seats → V1 setMode('sim'); 兩黨對決 / 補選 are V1's own
  //  independent toggles (toggle2Party / toggleByElection);
  //  party list → V1 setMode('winner') + setPLCountyMode('sim'), the
  //  party-list「推演」 option that History leaves out.
  // ⚙ opens V1's own parameter panel (toggleSimPanel), which sits outside
  // the hidden toolbar.
  var kind = 'district';
  var b2p = document.getElementById('btn-2p'), bBy = document.getElementById('btn-by');
  function sync(win) {
    document.querySelectorAll('[data-kind]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.kind === kind)); });
    b2p.disabled = bBy.disabled = kind !== 'district';
    b2p.setAttribute('aria-pressed', String(kind === 'district' && !!win.eval('twoParty')));
    bBy.setAttribute('aria-pressed', String(kind === 'district' && !!win.eval('byElectionMode')));
  }
  // V1's setMode() has no title for 'sim', so the map title kept whatever the
  // previous mode wrote (e.g. 「推演 不分區政黨票地圖」 after the party-list
  // scenario). Set it here; the party-list title is V1's own.
  function districtTitle(win) {
    var t = win.document.getElementById('map-title');
    if (!t || kind !== 'district') return;
    t.textContent = V2Shell.t('區域立委情境推演', 'District-seat scenario');
    t.style.fontSize = V2Shell.lang() === 'en' ? '10px' : '14px';
  }
  function enter(win) {
    if (kind === 'district') {
      win.setMode('sim');
      districtTitle(win);
    } else {
      if (win.eval('twoParty')) win.toggle2Party();
      if (win.eval('byElectionMode')) win.toggleByElection();
      // V1's winner mode asks the reader's party leaning once per load; that
      // question is about results, not about simulating, so skip it here.
      win.eval('_skipOnboardGateOnce = true');
      win.setMode('winner');
      win.setPLCountyMode('sim');
    }
    sync(win);
  }
  V2Shell.boot({
    engine: '../test.html',
    needs: ['setMode', 'setPLCountyMode', 'toggle2Party', 'toggleByElection', 'toggleSimPanel'],
    title: { zh: '情境推演', en: 'Scenarios' },
    stripBase5: true,
    onReady: function (win, shell) {
      enter(win);
      shell.onLang = function () { setTimeout(function () { districtTitle(win); }, 0); };
      document.querySelectorAll('[data-kind]').forEach(function (b) {
        b.addEventListener('click', function () { if (kind !== b.dataset.kind) { kind = b.dataset.kind; enter(win); } });
      });
      b2p.addEventListener('click', function () { win.toggle2Party(); sync(win); });
      bBy.addEventListener('click', function () { win.toggleByElection(); sync(win); });
      document.getElementById('btn-params').addEventListener('click', function () { win.toggleSimPanel(); });
    }
  });
</script>
</body>
</html>

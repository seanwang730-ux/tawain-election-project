  <iframe id="v2-engine" title="政黨基本盤（V1 test.html 引擎）"></iframe>

<script>
  // Party base votes only (reached from the methodology page): V1
  // setMode('baselean'). The voter-adjusted version (選舉人數校正) is the
  // method, not an option (user, 2026-10-22): the raw version mistakes
  // population growth or decline for political change, so it is switched
  // on before the map is drawn and V1's switch stays hidden.
  V2Shell.boot({
    engine: '../test.html',
    needs: ['setMode', 'setEligCorrected'],
    title: { zh: '政黨基本盤 2008–2024', en: 'Party base votes 2008–2024' },
    // the bar's 「i」 shows the overview's note (how 深／中／淺 are computed) — baseleanmap.js; user 2026-10-31
    infoNote: function (w) { return window.V2BaseLeanMap ? window.V2BaseLeanMap.note(w) : ''; },
    onReady: function (win) {
      win.setEligCorrected(true);
      // 台聯 / 歐巴桑聯盟 / 綠黨 → 其他（游離）, before anything is computed (baseleanmap.js; user 2026-10-31)
      if (window.V2BaseLeanMap) window.V2BaseLeanMap.fold(win);
      if (win.eval('mode') !== 'baselean') win.setMode('baselean');
      // the other pages' map structure (no population glow, colour on the county blocks), without the 鐵/中/淺 →
      // 總統票 flow cards and the 13-category legend (baseleanmap.js; user 2026-10-31)
      if (window.V2BaseLeanMap) window.V2BaseLeanMap.attach(win);
    }
  });
</script>
</body>
</html>
